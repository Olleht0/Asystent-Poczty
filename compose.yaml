services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_PATH: /data/email_assistant.db
    ports:
      - "8000:8000"
    volumes:
      - email_data:/data

  ui:
    build: .
    command: streamlit run app/ui/dashboard.py --server.address=0.0.0.0 --server.port=8080
    environment:
      API_URL: http://api:8000
    ports:
      - "8080:8080"
    depends_on:
      - api

volumes:
  email_data:
